name: Setup pgrx for tests
description: Install FFmpeg dependencies and initialize a downloaded PostgreSQL for pgrx

inputs:
  pg_version:
    description: PostgreSQL major version
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg8
        sudo apt-get update
        sudo apt-get install -y \
          build-essential pkgconf \
          libclang-dev \
          libavcodec-dev libavformat-dev libavutil-dev \
          libswscale-dev libswresample-dev \
          libavfilter-dev libavdevice-dev \
          libreadline-dev

    - name: Install cargo-pgrx
      shell: bash
      run: cargo install --locked cargo-pgrx

    - name: Initialize pgrx
      shell: bash
      run: |
        set +e
        v=$(cargo pgrx info version pg${{ inputs.pg_version }})
        if [ $? -ne 0 ]; then
          cargo pgrx init --pg${{ inputs.pg_version }} download
        fi
        set -e
        echo "$(dirname "$(cargo pgrx info pg-config pg${{ inputs.pg_version }})")" >> "$GITHUB_PATH"
